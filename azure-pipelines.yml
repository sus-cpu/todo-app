trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: CopyFilesOverSSH@0
    displayName: 'Copy project files to VM'
    inputs:
      sshEndpoint: 'todo-vm-ssh'
      sourceFolder: '$(Build.SourcesDirectory)'
      contents: |
        **
        !.git/**
        !**/.git/**
        !**/node_modules/**
        !**/venv/**
        !.env
        !backend/.env
      targetFolder: '/home/azureuser/todo-app'
      overwriteExisting: true

  - task: SSH@0
    displayName: 'Rebuild and restart containers'
    inputs:
      sshEndpoint: 'todo-vm-ssh'
      runOptions: 'commands'
      commands: |
        cd /home/azureuser/todo-app
        docker compose up --build -d